<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Goblins Quest 3 — DOS demo</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; touch-action: none; }
      body { position: relative; }
      canvas {
        position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0;
        background: #000; outline: none; image-rendering: auto; touch-action: none;
      }
      #output { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      #download-modal { display: none; position: absolute; inset: auto 1rem 1rem; z-index: 4; }
      #status {
        position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #1d1711, #050404 68%);
        transition: opacity 260ms ease;
      }
      #status.hidden { opacity: 0; pointer-events: none; }
      .status-box { width: min(23rem, calc(100% - 3rem)); text-align: center; color: #e8dfc5; }
      .status-mark {
        display: grid; place-items: center; width: 3.25rem; height: 3.25rem; margin: 0 auto 1rem;
        border: 1px solid rgba(241,199,91,.32); border-radius: 50%; color: #f1c75b; font-size: 1.25rem;
        animation: throb 1.2s ease-in-out infinite alternate;
      }
      #status-text { margin: 0; font-size: .75rem; line-height: 1.5; letter-spacing: .08em; text-transform: uppercase; }
      #progress { width: 100%; height: 3px; margin-top: 1rem; overflow: hidden; background: #241d17; }
      #progress > i { display: block; width: 12%; height: 100%; background: #f1c75b; transition: width 180ms ease; }
      #controls {
        position: absolute; z-index: 6; right: max(.6rem, env(safe-area-inset-right));
        bottom: max(.6rem, env(safe-area-inset-bottom)); display: flex; gap: .45rem;
        transition: opacity 180ms ease;
      }
      .control {
        min-height: 2.6rem; border: 1px solid rgba(255,255,255,.2); border-radius: .42rem; padding: .55rem .75rem;
        background: rgba(10,8,7,.78); color: #f5edda; font: 600 .64rem/1 ui-monospace, monospace;
        letter-spacing: .08em; text-transform: uppercase; backdrop-filter: blur(10px); touch-action: manipulation;
      }
      .control:active { background: rgba(241,199,91,.25); transform: translateY(1px); }
      #rotate-tip {
        display: none; position: absolute; z-index: 7; left: 50%; bottom: 4.1rem; transform: translateX(-50%);
        border: 1px solid rgba(241,199,91,.22); border-radius: .4rem; padding: .55rem .7rem;
        background: rgba(10,8,7,.84); color: #cabfae; font-size: .6rem; text-align: center; white-space: nowrap;
      }
      @media (orientation: portrait) and (max-width: 720px) { #rotate-tip { display: block; } }
      @media (hover: hover) and (pointer: fine) { #controls { opacity: .45; } #controls:hover { opacity: 1; } }
      @keyframes throb { to { transform: scale(1.08); box-shadow: 0 0 26px rgba(241,199,91,.17); } }
      @media (prefers-reduced-motion: reduce) { .status-mark { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" aria-label="Goblins Quest 3 game canvas"></canvas>
    <textarea id="output" aria-hidden="true"></textarea>
    <div id="download-modal" aria-hidden="true">
      <div id="download-modal-title"><h3>Loading ScummVM…</h3></div>
      <div id="download-modal-content">
        <div id="download-modal-progress"><div id="download-modal-progress-fill"></div></div>
        <p id="download-modal-progress-text">Downloaded 0 KB</p>
        <p id="download-modal-speed-text">Download speed: 0 MB/s</p>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite">
      <div class="status-box">
        <div class="status-mark">G3</div>
        <p id="status-text">Loading the ScummVM engine…</p>
        <div id="progress"><i></i></div>
      </div>
    </div>
    <div id="rotate-tip">Rotate your phone for the full view</div>
    <div id="controls" aria-label="Game controls">
      <button class="control" id="sound" type="button">Sound</button>
      <button class="control" id="inventory" type="button">Inventory</button>
      <button class="control" id="fullscreen" type="button">Full screen</button>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const progress = document.querySelector('#progress > i');
        const output = document.getElementById('output');
        const parentOrigin = location.origin;
        let lastPointer = { x: innerWidth / 2, y: innerHeight / 2 };
        let holdTimer = 0;
        let holdStart = null;
        let holdTriggered = false;
        let playerReady = false;
        const demoDirectory = '/games/gob3-dos-demo-en';
        const demoFiles = [
          '2.exe', '2.txt', 'all.ask', 'cat.inf', 'cd.cfg', 'gob3.exe',
          'imd.itk', 'imd.ltk', 'intro.stk', 'mdo.cfg', 'mdo.def', 'setup.exe'
        ];

        // Keep every demo-data request on this origin. This avoids mobile
        // privacy relays and cross-origin range-request handling differences.
        // The rewrite also protects returning visitors whose browser cached
        // the older catalog response with the third-party mirror URL.
        const nativeFetch = window.fetch.bind(window);
        const demoMirrorOrigin = 'https://scummvm-data.kuendig.io';
        const demoMirrorPath = '/gob3-dos-demo-en/';
        window.fetch = (input, init) => {
          if (typeof input !== 'string') return nativeFetch(input, init);

          const url = new URL(input, location.href);
          if (url.origin === demoMirrorOrigin && url.pathname.startsWith(demoMirrorPath)) {
            url.protocol = location.protocol;
            url.host = location.host;
            url.pathname = `/game-v5${url.pathname}`;
            return nativeFetch(url.href, init);
          }

          if (url.origin === location.origin && url.pathname === '/data/index.json') {
            url.searchParams.set('site-data', '5');
            return nativeFetch(url.href, { ...init, cache: 'reload' });
          }

          return nativeFetch(input, init);
        };

        const notify = (type, text) => {
          if (window.parent !== window) {
            window.parent.postMessage({ source: 'goblins3-player', type, text }, parentOrigin);
          }
        };

        const markReady = () => {
          if (playerReady) return;
          playerReady = true;
          setTimeout(() => {
            status.classList.add('hidden');
            document.getElementById('download-modal').style.display = 'none';
            notify('ready', 'Demo ready');
            document.title = 'Goblins Quest 3 — playable DOS demo';
          }, 500);
        };

        const rightClick = (x = lastPointer.x, y = lastPointer.y) => {
          const opts = { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y, button: 2, buttons: 2 };
          canvas.dispatchEvent(new MouseEvent('mousemove', { ...opts, button: 0, buttons: 0 }));
          canvas.dispatchEvent(new MouseEvent('mousedown', opts));
          canvas.dispatchEvent(new MouseEvent('mouseup', { ...opts, buttons: 0 }));
          canvas.dispatchEvent(new MouseEvent('contextmenu', opts));
          canvas.focus({ preventScroll: true });
        };

        const unlockAudio = async () => {
          const contexts = [window.SDL2 && window.SDL2.audioContext, window.Module && window.Module.SDL2 && window.Module.SDL2.audioContext].filter(Boolean);
          for (const context of contexts) {
            if (context.state === 'suspended') await context.resume().catch(() => {});
          }
          canvas.focus({ preventScroll: true });
        };

        canvas.addEventListener('contextmenu', (event) => event.preventDefault());
        canvas.addEventListener('pointermove', (event) => {
          lastPointer = { x: event.clientX, y: event.clientY };
        }, { passive: true });

        canvas.addEventListener('touchstart', (event) => {
          unlockAudio();
          if (event.touches.length !== 1) {
            clearTimeout(holdTimer);
            holdStart = null;
            return;
          }
          const touch = event.touches[0];
          lastPointer = { x: touch.clientX, y: touch.clientY };
          holdStart = { x: touch.clientX, y: touch.clientY };
          holdTriggered = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            if (!holdStart) return;
            holdTriggered = true;
            rightClick(holdStart.x, holdStart.y);
            if (navigator.vibrate) navigator.vibrate(20);
          }, 520);
        }, { passive: true, capture: true });

        canvas.addEventListener('touchmove', (event) => {
          if (!holdStart || event.touches.length !== 1) return;
          const touch = event.touches[0];
          lastPointer = { x: touch.clientX, y: touch.clientY };
          if (Math.hypot(touch.clientX - holdStart.x, touch.clientY - holdStart.y) > 12) {
            clearTimeout(holdTimer);
            holdStart = null;
          }
        }, { passive: true, capture: true });

        const endHold = (event) => {
          clearTimeout(holdTimer);
          holdStart = null;
          if (holdTriggered) {
            event.preventDefault();
            event.stopImmediatePropagation();
            holdTriggered = false;
          }
        };
        canvas.addEventListener('touchend', endHold, { passive: false, capture: true });
        canvas.addEventListener('touchcancel', endHold, { passive: false, capture: true });

        document.getElementById('inventory').addEventListener('click', () => rightClick());
        document.getElementById('sound').addEventListener('click', unlockAudio);
        document.getElementById('fullscreen').addEventListener('click', async () => {
          await document.documentElement.requestFullscreen?.().catch(() => {});
          await screen.orientation?.lock?.('landscape')?.catch(() => {});
          unlockAudio();
        });

        addEventListener('message', (event) => {
          if (event.origin !== location.origin || event.data?.source !== 'goblins3-shell') return;
          if (event.data.type === 'fullscreen') document.getElementById('fullscreen').click();
        });

        window.Module = {
          preRun: [() => {
            const dependency = 'preload-gob3-demo';
            addRunDependency(dependency);

            (async () => {
              FS.mkdirTree(demoDirectory);

              for (let index = 0; index < demoFiles.length; index += 1) {
                const filename = demoFiles[index];
                const percent = Math.round(((index + 1) / demoFiles.length) * 72) + 12;
                statusText.textContent = `Loading demo files ${index + 1}/${demoFiles.length}…`;
                progress.style.width = `${percent}%`;
                notify('status', `Loading demo files ${index + 1}/${demoFiles.length}…`);

                const response = await nativeFetch(
                  `/game-v5/gob3-dos-demo-en/${encodeURIComponent(filename)}`,
                  { cache: 'reload' },
                );
                if (!response.ok) {
                  throw new Error(`${filename}: HTTP ${response.status}`);
                }

                FS.writeFile(`${demoDirectory}/${filename}`, new Uint8Array(await response.arrayBuffer()));
              }
            })()
              .then(() => removeRunDependency(dependency))
              .catch((error) => {
                const detail = error instanceof Error ? error.message : String(error);
                statusText.textContent = `Demo download failed: ${detail}`;
                notify('status', `Demo download failed: ${detail}`);
                console.error('Goblins 3 preload failed:', error);
              });
          }],
          postRun: [markReady],
          print(text) {
            if (!text) return;
            output.value += text + '\n';
            if (/Running Goblins Quest 3/i.test(text)) {
              statusText.textContent = 'Starting Goblins Quest 3…';
              progress.style.width = '96%';
              markReady();
            }
          },
          printErr(text) { console.error(text); },
          canvas,
          setStatus(text) {
            if (!text) return;
            const clean = String(text).replace(/\([^)]*\)/g, '').trim();
            statusText.textContent = clean || 'Loading…';
            const match = String(text).match(/(\d+)\/(\d+)/);
            if (match) progress.style.width = Math.max(12, Math.round((Number(match[1]) / Number(match[2])) * 88)) + '%';
            notify('status', clean || 'Loading…');
          },
          onRuntimeInitialized() {
            if (typeof window.httpHideProgressBar === 'function') window.httpHideProgressBar();
          },
          totalDependencies: 0,
          monitorRunDependencies(left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            const done = this.totalDependencies ? (this.totalDependencies - left) / this.totalDependencies : 0;
            progress.style.width = Math.max(12, Math.round(done * 88)) + '%';
          },
          locateFile(path) {
            if (path === 'scummvm.wasm') return '/runtime/scummvm.wasm';
            const dataPath = path.indexOf('/data/');
            if (dataPath >= 0) return path.slice(dataPath);
            return '/runtime/' + path;
          }
        };

        const script = document.createElement('script');
        script.src = '/runtime/scummvm.js';
        script.async = true;
        script.onerror = () => {
          statusText.textContent = 'The game engine could not be reached. Please reload.';
          notify('status', 'Runtime unavailable');
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
